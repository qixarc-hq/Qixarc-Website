<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | QIXARC</title><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/style.css?v=admin-1"><link rel="stylesheet" href="/pages.css?v=admin-1"><link rel="stylesheet" href="/admin/admin.css?v=1"><script src="/assets/supabase-2.117.2.js" defer></script><script src="/supabase-config.js" defer></script><script src="/database.js" defer></script><script src="/admin/admin.js?v=1" defer></script><!-- SEO -->
<meta name="robots" content="noindex,nofollow">

</head><body class="admin-page"><header class="admin-header"><a href="/" class="wordmark"><img src="/assets/logo-nav.webp" width="48" height="48" alt=""><span>QIXARC / ADMIN</span></a><button id="logout" class="button outline" hidden>Sign out</button></header><main class="admin-main"><section id="login-panel" class="admin-login"><span class="section-label">EMPLOYEE ACCESS</span><h1>Welcome back.</h1><p>Sign in to manage enquiries, Blog and R&amp;D.</p><form id="login-form"><label>Username<input name="username" autocomplete="username" required value="user"></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="button dark" type="submit">Sign in →</button></form></section><p id="admin-status" role="status"></p><section id="dashboard" hidden><div class="admin-top"><div><span class="section-label">QIXARC WORKSPACE</span><h1>Studio dashboard.</h1></div><a href="/" class="text-link">View website ↗</a></div><nav class="admin-tabs" aria-label="Admin sections"><button data-tab="enquiries" aria-pressed="true">Enquiries</button><button data-tab="blog" aria-pressed="false">Blog</button><button data-tab="research" aria-pressed="false">R&amp;D</button></nav><div class="admin-toolbar"><h2 id="workspace-title">Enquiries</h2><button id="refresh" class="button outline">Refresh</button><button id="new-content" class="button dark" hidden>New entry +</button></div><div id="admin-list"></div><button id="load-more" class="button outline" hidden>Load more</button><section id="editor" class="admin-editor" hidden><h2 id="editor-title">Edit entry</h2><form id="content-form"><input type="hidden" name="id"><label>Title<input name="title" required maxlength="180"></label><label>URL slug<input name="slug" required maxlength="100" pattern="[a-z0-9]+(-[a-z0-9]+)*" placeholder="your-article-title"></label><label>Summary<textarea name="summary" rows="3" maxlength="600"></textarea></label><label>Body<textarea name="body" required rows="14" maxlength="50000"></textarea></label><p class="form-help">Plain text. Separate paragraphs with a blank line. Start a line with ## for a heading.</p><label>Visibility<select name="status"><option value="draft">Draft — admins only</option><option value="published">Published — visible on website</option></select></label><div class="editor-actions"><button class="button dark" type="submit">Save entry</button><button class="button outline" id="cancel-edit" type="button">Cancel</button></div></form></section></section></main></body></html>
